/* 編碼：deflate + base64url（不支援時退回純 base64） */
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const pipe=async(u,S)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(S)).arrayBuffer());
async function enc(o){const u=new TextEncoder().encode(JSON.stringify(o));try{return'z'+b64(await pipe(u,new CompressionStream('deflate-raw')))}catch(_){return'r'+b64(u)}}
async function dec(s){s=s.replace(/\s+/g,'');const m=s[0],u=ub64(s.slice(1));return JSON.parse(new TextDecoder().decode(m==='z'?await pipe(u,new DecompressionStream('deflate-raw')):u))}
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,3500)});

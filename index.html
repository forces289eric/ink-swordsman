 }else if(A.s==='wind'){

4:{intro:[['旁白','國子監的書聲未散，一位白髮老儒橫戒尺，擋在藏書閣前。'],['清流領袖','老夫上書三十次，三十次石沉大海。你們江湖人的刀，能比奏摺管用？'],['青衣女子','大人，這是戶部的真帳。'],['清流領袖','真帳在誰手裡，誰就是下一個被抄家的。我憑什麼信你們？'],['墨影劍客','憑我們現在站在這裡。']],boss:[['清流領袖','要談，先過老夫這一關！']],end:[['旁白','老儒收起戒尺，緩緩坐下。'],['清流領袖','好……老夫信你們一回。明日早朝，我上第三十一道奏摺。'],['青衣女子','大人保重。'],['旁白','離開時，藏書閣外的更夫低聲說：東廠的人，正往詔獄去了。']]},
5:{intro:[['旁白','詔獄深處，鐵鏈聲此起彼落。一間間牢房裡，關著上過奏摺的忠臣。'],['老臣','年輕人……別管老夫，帳本要緊。'],['詔獄指揮','劫獄？按律當斬。'],['墨影劍客','先放人，再說律。']],boss:[['詔獄指揮','鎖門，一個也別放走！']],end:[['旁白','牢門一扇扇打開，囚犯們互相攙扶著走出黑暗。'],['老臣','老夫在牢裡寫了一份名單，記著宦官黨羽和每一筆贓款。拿去。'],['青衣女子','又多了一份證據。']]},
6:{intro:[['旁白','東廠大牢，刑具森然。名冊上，青兒的名字被朱筆圈了，有人出賣了她。'],['督主心腹','青兒，你偷了帳，想拿它去哪？'],['青衣女子','拿去給天下人看。'],['督主心腹','你父親也這麼說，最後呢？'],['墨影劍客','他沒能說完的話，由我們替他說。']],boss:[['督主心腹','東廠的規矩，進來的人都得開口。']],end:[['旁白','督主心腹倒在刑架旁，嘴角卻扯出一絲冷笑。'],['督主心腹','你們以為……一路都是靠自己闖過來的？替你們開路的，另有其人。'],['青衣女子','他在說什麼？'],['旁白','少年望向大牢深處，那條通往城牆下的暗渠，水聲正在作響。']]},
7:{intro:[['旁白','暗渠水聲潺潺，一個披蓑衣的身影，立在斷水閘前。'],['雨夜修羅','我說過，等你走到最上面，會有人告訴你。我來，是想親口說完。'],['雨夜修羅','這十年，我在錦衣衛底下討飯吃，這把繡春刀，就是他們給的。這條暗渠，我走過不下百遍。'],['墨影劍客','師父那一夜，是你遞的信。'],['雨夜修羅','是我。也是我，沒敢回去。'],['雨夜修羅','今夜我不再缺席。拔劍吧，讓我知道，師父沒有白死。']],boss:[['雨夜修羅','來！']],end:[['旁白','修羅收刀入鞘，轉身扳動閘門，渠水轟然退去，露出一條通往宮牆的暗道。'],['雨夜修羅','我拿到了繡春刀，還是贏不了你。'],['墨影劍客','師父說劍是用來停的。你今夜收手，就是學會了。'],['雨夜修羅','東廠的人快追來了。這條路，我替你守。'],['墨影劍客','一起走。'],['雨夜修羅','師父一個人走過一次。這一次，換我。'],['旁白','少年還想再開口，修羅已把閘門在身後關上。']]}

8:{intro:[['旁白','御花園內，桂花落了一地，禁軍列陣如牆。統領拄刀立在石橋中央。'],['禁軍統領','末將職責所在，不問是非。廠公有令，擅入宮禁者，殺無赦。'],['青衣女子','統領可知，你守的宮牆內，每年有多少人因一筆假帳而死？'],['禁軍統領','……軍令如山。'],['旁白','統領身後，一名副統領按刀而立，始終一言不發，只盯著青兒懷裡的帳冊。'],['墨影劍客','那就讓我打破這座山。']],boss:[['禁軍統領','列陣！']],end:[['旁白','統領單膝跪地，刀插入土中。'],['禁軍統領','末將輸了。宮門的鑰匙，在那棵桂樹下。'],['墨影劍客','你不攔我們？'],['禁軍統領','末將只守宮牆，不守奸臣。'],['旁白','副統領默默收刀退到一旁，沒有看統領，也沒有看少年，只最後瞥了一眼那本帳冊，轉身往宮裡去了。']]},
9:{intro:[['旁白','午門前，文武百官分列兩側，無人敢出聲。大內總管尖聲宣讀聖旨。'],['大內總管','奉旨：逆賊闖宮，格殺勿論！百官誰敢包庇，同罪！'],['旁白','百官低頭，唯有一位白髮老儒顫巍巍走出隊列。'],['清流領袖','老夫有本要奏！戶部侍郎篡改稅帳，每一筆，皆有真帳為證！'],['大內總管','大膽！給咱家拿下！'],['墨影劍客','要拿他，先過我這關。']],boss:[['大內總管','反了反了！']],end:[['旁白','總管倒在午門前，聖旨散落一地。百官怔怔望著，不知是誰先跪了下去，隨後，百官紛紛向清流領袖行禮。'],['清流領袖','今日之後，朝堂不會再一樣了。'],['青衣女子','還剩最後一個人。']]},
10:{intro:[['旁白','金鑾殿前，四名黑衣高手肅立如鐵。護衛長手按劍柄，目光如冰。'],['廠公護衛長','廠公在殿內等你。勝過我們四人，才有資格見他。'],['墨影劍客','一個一個，還是一起上？'],['廠公護衛長','一起。']],boss:[['廠公護衛長','四人合擊！']],end:[['旁白','四名高手相繼倒下，殿門在風中緩緩洞開。'],['青衣女子','帳本在我這裡。無論結局如何，我陪你進去。']]},
11:{intro:[['旁白','司禮監深處，燈火通明。廠公端坐簾後，把玩著一枚玉扳指。'],['廠公','來了。咱家等你們很久了。'],['青衣女子','我父親的名字，在你的朱筆下。'],['廠公','哦？你是那個帳房的女兒。咱家記得他，寫得一手好字，可惜不肯改帳。'],['墨影劍客','你的帳，今日清算。'],['廠公','憑你？咱家執掌天下三十年，豈會敗給一個江湖人？']],boss:[['廠公','來人！']],end:[['旁白','廠公倒在朱筆與帳冊之間，玉扳指滾落階前，碎成兩半。'],['廠公','咱家……不過是……這朝廷養出來的一條狗……'],['墨影劍客','誰養的？說！'],['廠公','咱家……不會說……說了……你們，活不過今夜……'],['旁白','帳冊最末一頁，蓋著半枚被朱筆塗去的印。少年當它是廠公的私印，沒有多想。'],['旁白','廠公閉上眼的那一刻，簾外傳來腳步聲，清流領袖與禁軍統領，帶著百官趕到。'],['旁白','禁軍統領的目光，在帳冊與屍身之間停了一瞬。那目光裡，沒有半分驚訝。少年心頭一沉，卻抓不住是哪裡不對。']]}

 {t:'把罪證交給朝廷，依法審判',f:()=>{let p1=null;try{p1=JSON.parse(localStorage.getItem('inkP1')||'null')}catch(e){}const sp1=(p1&&p1.sp)||[],N1=sp1.filter(v=>v===1||v===3).length,fn=[];for(let i=0;i<22&&fn.length<4;i++)if((sp1[i]===1||sp1[i]===3)&&i!==17&&CHAPTERS[1].ally[i])fn.push(CHAPTERS[1].ally[i].n);const ok=N1+SPN()>=14;BR.end=ok?'D2':'D1';const A=[['旁白','少年把帳本與名單'+(SPARED[9]===1?'、大內總管獻上的宮中名冊':'')+'呈上，青兒親手翻開父親那一頁。清流領袖以三十年清名擔保，三司會審，一個不漏。'],[NM8(),'帳本事關重大，今夜由末將率禁軍看守，送刑部封存。'],['旁白','少年握著帳本，想起那一瞬毫無驚訝的目光，遲遲沒有鬆手。'],['清流領袖','你若連朝廷法度都不信，這案子，就只剩刀能審了。老夫以三十年清名擔保。'],['旁白','少年終於鬆手。他解下劍，交到'+NM8()+'手中：「廠公是我殺的，這罪我認。帳，請諸位審。」'],['旁白','當夜，禁軍看守封存的刑部走了水。帳本、名單、口供，燒得只剩一地灰。'],['旁白','罪名早已擬好，只等廠公一死。天亮時，一道懿旨自慈寧宮傳出：墨影劍客勾結魔宮餘孽，弒殺朝廷重臣，謀逆作亂；青衣女子為其同黨；清流領袖結黨包庇，一併收押。'],['青衣女子','真的那本……被人燒了。他們早就等在這裡。'],['清流領袖','老夫查了三十年的案，到頭來，審的是自己。'],['旁白','三日後，午門。監斬的是當朝國舅，太后的親兄。帳冊上被朱筆塗去的那半枚印，正是他府上的。外戚諸府的老爺們，在棚下看熱鬧。']];const B=ok?[['旁白','鼓聲未落，人群裡忽然揚起一面白旗。被放過的人，一個接一個從人群裡走了出來：'+(fn.length?fn.join('、')+'……':'酒仙、老匠……')+'。'],['旁白','刑場大亂。刀落下前一瞬，少年、青兒、清流領袖，被人從斷頭台上拖了下來。'],['清流領袖','老夫斷了三十年的案，今日才知道，天下還有人，肯為「公道」二字拔刀。'],['青衣女子','走！人還在，帳，就還有人記得！'],['旁白','一行人在被放過的人護送下，連夜出了京。懸賞告示貼滿了城門，可京城裡，國舅的臉色，一夜比一夜難看。'],['墨影劍客','廠公只是條狗。牽繩的人，總有一天要露面。']]:[['墨影劍客','廠公說得對……他只是條狗。'],['旁白','鼓聲三響，刀光落下。一場假罪，換走了所有說真話的人。'],['旁白','後來的人說，那年秋天，京城的稅，反倒又加了一成。']];return{tx:ok?'劫法場':'午門問斬',l:A.concat(B)}}},
 {t:'帶青兒連夜出京，隱姓埋名',f:()=>{BR.end='D4';return{tx:'隱姓埋名',l:[['旁白','百官散去後，少年在殿中站了很久。廠公臨終那句「活不過今夜」，一直在耳邊轉。'],['旁白','少年想起'+NM8()+'那一瞬毫無驚訝的目光：狗死了，牽繩的人，卻一點也不意外。'],['旁白','少年先去找清流領袖，勸他帶著帳本，連夜一同出京。'],['清流領袖','老夫查了三十年，三十年清名，不信這朝廷敢動。帳本是證物，離了朝堂，就成了贓物，只能留在老夫手裡。'],['墨影劍客','廠公說，活不過今夜。那不是氣話。'],['清流領袖','老夫若走，這案子就沒人審了。你帶青兒走，不必管老夫。'],['旁白','少年勸不動，只得把帳本留下。他回頭對青兒說：「人，跟我走，今夜就走。」'],['青衣女子','可是清流大人他們……'],['墨影劍客','他不肯走，我們不能陪他賭。我信不過這座宮。'],['旁白','二人換上粗布衣裳，混在出城的流民裡，連夜出了京。'],['旁白','三日後，身後傳來消息：刑部失火，帳本無存。又過數日，城門貼出告示，清流領袖及其同黨，問斬午門；墨影劍客與青衣女子，畫影圖形，通緝天下。'],['青衣女子','要是我們留下……'],['墨影劍客','留下，這張告示上，就是三個人的名字，而且，都在刑場上。'],['旁白','南方一座小鎮，多了一對教書與打鐵的外鄉人。沒有人知道，那位沉默的鐵匠，曾是名動江湖的墨影劍客。'],['旁白','兵器埋在後院的桂花樹下。有人問起來歷，只說是路過的逃難人。江湖再無那個名字，可京城裡，有人夜夜睡不安穩。']]}}},
 {t:'交出證據，轉身離去',f:()=>{BR.end='D3';return{tx:'亡命天涯',l:[['旁白','少年把帳本交給青兒與清流領袖。他想起'+NM8()+'那一瞬毫無驚訝的目光，始終放不下心。'],['墨影劍客','這座宮不對勁。帳本別留在宮裡，跟我走。'],['清流領袖','老夫一走，這案子就成了畏罪潛逃。查了三十年，老夫要親眼看它過堂。'],['青衣女子','我爹的帳，我得看它審完。你先走，我隨後就到。'],['旁白','少年勸了兩次，兩人都不肯動。他終究沒有硬拉她，一個人走出了宮門。'],['旁白','少年連夜出了京。三日後，身後傳來消息：刑部失火，帳本無存。'],['旁白','又過數日，城門貼出告示：墨影劍客勾結魔宮餘孽，弒殺重臣，謀逆作亂；青衣女子、清流領袖同黨，已於午門問斬。'],['墨影劍客','……我該把她扛在肩上帶走的。'],['旁白','少年活了下來，背上多了一道通緝，與兩條無法歸還的人命。城外的大道上，風很冷。']]}}}
